definitions:
  schemas.CreateMeetingRequest:
    properties:
      description:
        example: Разбираем основные угрозы и способы защиты
        type: string
      hostId:
        example: 3f1c0c3e-6a3b-4c53-9d63-3a0f8d3c3a11
        type: string
      startsAt:
        description: RFC 3339, с часовым поясом
        example: '2026-12-01T10:00:00+05:00'
        type: string
      title:
        example: 'День информирования: кибербезопасность'
        type: string
    type: object
  schemas.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  schemas.Meeting:
    properties:
      createdAt:
        type: string
      description:
        type: string
      host:
        $ref: '#/definitions/schemas.MeetingHost'
      id:
        type: string
      link:
        type: string
      startsAt:
        type: string
      title:
        type: string
    type: object
  schemas.MeetingHost:
    properties:
      displayName:
        type: string
      id:
        type: string
    type: object
  schemas.RegisterRequest:
    properties:
      displayName:
        type: string
      email:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/auth/login:
    post:
      parameters:
        - description: Логин и пароль
          in: body
          name: user-data
          required: true
          schema:
            $ref: '#/definitions/schemas.LoginRequest'
      responses:
        '200':
          description: OK
        '400':
          description: invalid json
        '401':
          description: invalid email or password
      summary: Вход ведущего
      tags:
        - auth
  /api/auth/register:
    post:
      parameters:
        - description: Логин, пароль и имя
          in: body
          name: user-data
          required: true
          schema:
            $ref: '#/definitions/schemas.RegisterRequest'
      responses:
        '201':
          description: Created
        '400':
          description: email, displayName and password (10+ chars) are required
        '409':
          description: email already registered
        '500':
          description: could not hash password
      summary: Регистрация ведущего
      tags:
        - auth
  /api/meetings:
    get:
      description: Отсортирован по дате начала (ближайшие первыми).
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/schemas.Meeting'
            type: array
        '401':
          description: unauthorized
        '500':
          description: could not load meetings
      security:
        - BearerAuth: []
      summary: Список созданных встреч
      tags:
        - meetings
    post:
      consumes:
        - application/json
      description: Только для пользователей с ролью organizer. Ссылка на встречу генерируется
        на бэкенде.
      parameters:
        - description: Данные встречи
          in: body
          name: meeting
          required: true
          schema:
            $ref: '#/definitions/schemas.CreateMeetingRequest'
      produces:
        - application/json
      responses:
        '201':
          description: Created
          schema:
            $ref: '#/definitions/schemas.Meeting'
        '400':
          description: invalid json / title is required / startsAt must be in the
            future / host not found
        '401':
          description: unauthorized
        '403':
          description: only organizers can create meetings
        '500':
          description: could not create meeting
      security:
        - BearerAuth: []
      summary: Создать встречу
      tags:
        - meetings
  /api/meetings/{token}/ws:
    get:
      description: 'Открывает WebSocket к комнате встречи ({token} — последняя часть
        ссылки на встречу).

        Браузер не умеет слать заголовки при WebSocket, поэтому JWT передаётся в query:
        `?token=<jwt>`.


        Клиент → сервер: `{"channel":"chat"|"questions","text":"..."}`.

        Сервер → клиент: `{"type":"history","channel":"chat","messages":[...]}` (при
        входе, по одному на чат),

        `{"type":"message","channel":"chat","message":{id,channel,author{id,displayName,role},text,createdAt}}`

        и `{"type":"error","error":"..."}`.'
      parameters:
        - description: Токен из ссылки на встречу
          in: path
          name: token
          required: true
          type: string
      responses:
        '101':
          description: Switching Protocols
        '401':
          description: unauthorized
        '404':
          description: meeting not found
      security:
        - BearerAuth: []
      summary: 'Комната встречи: чаты по WebSocket'
      tags:
        - meetings
  /health:
    get:
      responses:
        '200':
          description: Сервис работает
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка здоровья сервиса
      tags:
        - health
securityDefinitions:
  BearerAuth:
    description: 'Формат: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: '2.0'
