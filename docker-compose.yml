services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: awareness_days
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d awareness_days"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: